{{/*
2.4.0 makes `--enable-email-verification` with no working SMTP a FATAL boot
error, not a warning: every recovery route terminates at the same mailbox, so
without a mail path a user is created unverified and can never recover.

Caught at render time rather than letting it through, because the failure mode
in-cluster is a CrashLoopBackOff whose cause is one line in the container log.
The condition mirrors the server's IsEmailServiceEnabled exactly — host set,
port > 0, sender email set — so this never rejects a config the server accepts.
*/}}
{{- if .Values.authorizer.enable_email_verification }}
  {{- if not (and .Values.authorizer.smtp_host (gt (int .Values.authorizer.smtp_port) 0) .Values.authorizer.smtp_sender_email) }}
    {{- fail "authorizer.enable_email_verification is true but SMTP is incomplete. Authorizer 2.4.0 exits at boot in this configuration (users would be created unverified with no way to ever verify), so the pod would CrashLoopBackOff. Set authorizer.smtp_host, authorizer.smtp_port and authorizer.smtp_sender_email, or set enable_email_verification: false." }}
  {{- end }}
{{- end }}
{{/*
--url is REQUIRED as of Authorizer 2.4.0 — unconditionally, not just with
--mcp-enabled. The server EXITS at boot without it rather than starting in a
degraded mode.

Without it the server derives its own host from request headers
(X-Authorizer-URL, X-Forwarded-Host, Host), so a forged header makes a genuine
password-reset or verification email carry a link to an attacker-controlled
domain (CWE-640). With --mcp-enabled it is worse still: every token presented
at /mcp is checked against <url>/mcp, so a header-derived identifier would let
a caller name the audience their own token must match — no check at all.

Caught at render time for the same reason as the SMTP check above: in-cluster
the failure is a CrashLoopBackOff whose cause is one line in the container log.
*/}}
{{- if not .Values.authorizer.authorizer_url }}
  {{- fail "authorizer.authorizer_url is required as of Authorizer 2.4.0 — the server exits at boot without it and the pod would CrashLoopBackOff. Set authorizer.authorizer_url to this deployment's own public base URL, including the scheme (e.g. https://auth.example.com); a bare hostname is rejected. Note this is NOT authorizer.allowed_origins: authorizer_url is where Authorizer itself is reachable, allowed_origins is the list of apps it may redirect to." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "..fullname" . }}
  labels:
    {{- include "..labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "..selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "..selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "..serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # v2 requires all configuration via CLI args.
          # Use shell expansion to map env vars to CLI flags (same pattern as railway/heroku/render Dockerfiles).
          command: ["/bin/sh", "-c"]
          args:
            - |
              ./authorizer \
                --database-type="${DATABASE_TYPE}" \
                --database-url="${DATABASE_URL}" \
                --database-name="${DATABASE_NAME}" \
                --database-username="${DATABASE_USERNAME}" \
                --database-password="${DATABASE_PASSWORD}" \
                --database-host="${DATABASE_HOST}" \
                --database-port="${DATABASE_PORT:-0}" \
                --database-cert="${DATABASE_CERT}" \
                --database-ca-cert="${DATABASE_CA_CERT}" \
                --database-cert-key="${DATABASE_CERT_KEY}" \
                --fga-store="${FGA_STORE}" \
                --fga-store-url="${FGA_STORE_URL}" \
                --fga-allow-unconstrained-agents="${FGA_ALLOW_UNCONSTRAINED_AGENTS:-false}" \
                --client-id="${CLIENT_ID}" \
                --client-secret="${CLIENT_SECRET}" \
                --admin-secret="${ADMIN_SECRET}" \
                --redis-url="${REDIS_URL}" \
                --jwt-type="${JWT_TYPE}" \
                --jwt-secret="${JWT_SECRET}" \
                {{- if .Values.authorizer.encryption_key }}
                --encryption-key="${ENCRYPTION_KEY}" \
                {{- end }}
                --jwt-private-key="${JWT_PRIVATE_KEY}" \
                --jwt-public-key="${JWT_PUBLIC_KEY}" \
                --jwt-role-claim="${JWT_ROLE_CLAIM}" \
                --jwt-secondary-type="${JWT_SECONDARY_TYPE}" \
                --jwt-secondary-secret="${JWT_SECONDARY_SECRET}" \
                --jwt-secondary-private-key="${JWT_SECONDARY_PRIVATE_KEY}" \
                --jwt-secondary-public-key="${JWT_SECONDARY_PUBLIC_KEY}" \
                --custom-access-token-script="${CUSTOM_ACCESS_TOKEN_SCRIPT}" \
                --roles="${ROLES}" \
                --default-roles="${DEFAULT_ROLES}" \
                --protected-roles="${PROTECTED_ROLES}" \
                --allowed-origins="${ALLOWED_ORIGINS}" \
                --default-authorize-response-type="${DEFAULT_AUTHORIZE_RESPONSE_TYPE}" \
                --default-authorize-response-mode="${DEFAULT_AUTHORIZE_RESPONSE_MODE}" \
                --oauth2-1-strict="${OAUTH2_1_STRICT:-false}" \
                --organization-name="${ORGANIZATION_NAME}" \
                --organization-logo="${ORGANIZATION_LOGO}" \
                --smtp-host="${SMTP_HOST}" \
                --smtp-port="${SMTP_PORT:-0}" \
                --smtp-username="${SMTP_USERNAME}" \
                --smtp-password="${SMTP_PASSWORD}" \
                --smtp-sender-email="${SENDER_EMAIL}" \
                --smtp-sender-name="${SENDER_NAME}" \
                --smtp-local-name="${SMTP_LOCAL_NAME}" \
                --smtp-skip-tls-verification="${SMTP_SKIP_TLS_VERIFICATION:-false}" \
                --reset-password-url="${RESET_PASSWORD_URL}" \
                --backchannel-logout-uri="${BACKCHANNEL_LOGOUT_URI}" \
                --url="${AUTHORIZER_URL}" \
                --env="${ENV}" \
                --host="${HOST:-0.0.0.0}" \
                --http-port="${PORT:-8080}" \
                --metrics-port="${METRICS_PORT:-8081}" \
                --metrics-host="${METRICS_HOST:-0.0.0.0}" \
                --grpc-port="${GRPC_PORT:-9091}" \
                --enable-grpc-reflection="${ENABLE_GRPC_REFLECTION:-true}" \
                --grpc-insecure="${GRPC_INSECURE:-false}" \
                --grpc-tls-cert="${GRPC_TLS_CERT}" \
                --grpc-tls-key="${GRPC_TLS_KEY}" \
                ${MCP_ENABLED:+--mcp-enabled="$MCP_ENABLED"} \
                --enable-client-id-metadata-document="${ENABLE_CLIENT_ID_METADATA_DOCUMENT:-false}" \
                --client-id-metadata-allowed-domains="${CLIENT_ID_METADATA_ALLOWED_DOMAINS}" \
                --enable-dynamic-client-registration="${ENABLE_DYNAMIC_CLIENT_REGISTRATION:-false}" \
                --rate-limit-rps="${RATE_LIMIT_RPS}" \
                --rate-limit-burst="${RATE_LIMIT_BURST}" \
                --rate-limit-fail-closed="${RATE_LIMIT_FAIL_CLOSED}" \
                --trusted-proxies="${TRUSTED_PROXIES}" \
                --refresh-token-expires-in="${REFRESH_TOKEN_EXPIRES_IN:-2592000}" \
                --enable-hsts="${ENABLE_HSTS:-false}" \
                --disable-csp="${DISABLE_CSP:-false}" \
                --graphql-max-complexity="${GRAPHQL_MAX_COMPLEXITY:-300}" \
                --graphql-max-depth="${GRAPHQL_MAX_DEPTH:-15}" \
                --graphql-max-aliases="${GRAPHQL_MAX_ALIASES:-30}" \
                --graphql-max-body-bytes="${GRAPHQL_MAX_BODY_BYTES:-1048576}" \
                --log-level="${LOG_LEVEL:-info}" \
                --enable-login-page="${ENABLE_LOGIN_PAGE:-true}" \
                --enable-org-discovery="${ENABLE_ORG_DISCOVERY:-false}" \
                --enable-playground="${ENABLE_PLAYGROUND:-true}" \
                --disable-admin-header-auth="${DISABLE_ADMIN_HEADER_AUTH:-true}" \
                --enable-graphql-introspection="${ENABLE_GRAPHQL_INTROSPECTION:-true}" \
                --app-cookie-secure="${APP_COOKIE_SECURE:-true}" \
                --app-cookie-same-site="${APP_COOKIE_SAME_SITE:-none}" \
                --admin-cookie-secure="${ADMIN_COOKIE_SECURE:-true}" \
                --enable-strong-password="${ENABLE_STRONG_PASSWORD:-true}" \
                --enable-basic-authentication="${ENABLE_BASIC_AUTHENTICATION:-true}" \
                --enable-email-verification="${ENABLE_EMAIL_VERIFICATION:-false}" \
                --enable-mobile-basic-authentication="${ENABLE_MOBILE_BASIC_AUTHENTICATION:-true}" \
                --enable-phone-verification="${ENABLE_PHONE_VERIFICATION:-false}" \
                --enable-magic-link-login="${ENABLE_MAGIC_LINK_LOGIN:-false}" \
                --enforce-mfa="${ENFORCE_MFA:-false}" \
                --disable-totp-login="${DISABLE_TOTP_LOGIN:-false}" \
                --disable-webauthn-mfa="${DISABLE_WEBAUTHN_MFA:-false}" \
                --disable-email-otp="${DISABLE_EMAIL_OTP:-false}" \
                --disable-sms-otp="${DISABLE_SMS_OTP:-false}" \
                --disable-mfa="${DISABLE_MFA:-false}" \
                --enable-signup="${ENABLE_SIGNUP:-true}" \
                --twilio-account-sid="${TWILIO_ACCOUNT_SID}" \
                --twilio-api-key="${TWILIO_API_KEY}" \
                --twilio-api-secret="${TWILIO_API_SECRET}" \
                --twilio-sender="${TWILIO_SENDER}" \
                --couchbase-bucket="${COUCHBASE_BUCKET}" \
                --couchbase-scope="${COUCHBASE_SCOPE}" \
                --couchbase-ram-quota="${COUCHBASE_RAM_QUOTA}" \
                --aws-region="${AWS_REGION}" \
                --aws-access-key-id="${AWS_ACCESS_KEY_ID}" \
                --aws-secret-access-key="${AWS_SECRET_ACCESS_KEY}" \
                --google-client-id="${GOOGLE_CLIENT_ID}" \
                --google-client-secret="${GOOGLE_CLIENT_SECRET}" \
                --google-scopes="${GOOGLE_SCOPES}" \
                --github-client-id="${GITHUB_CLIENT_ID}" \
                --github-client-secret="${GITHUB_CLIENT_SECRET}" \
                --github-scopes="${GITHUB_SCOPES}" \
                --facebook-client-id="${FACEBOOK_CLIENT_ID}" \
                --facebook-client-secret="${FACEBOOK_CLIENT_SECRET}" \
                --facebook-scopes="${FACEBOOK_SCOPES}" \
                --microsoft-client-id="${MICROSOFT_CLIENT_ID}" \
                --microsoft-client-secret="${MICROSOFT_CLIENT_SECRET}" \
                --microsoft-tenant-id="${MICROSOFT_TENANT_ID}" \
                --microsoft-allowed-tenants="${MICROSOFT_ALLOWED_TENANTS}" \
                --microsoft-scopes="${MICROSOFT_SCOPES}" \
                --oauth-allow-unverified-provider-email="${OAUTH_ALLOW_UNVERIFIED_PROVIDER_EMAIL:-false}" \
                --apple-client-id="${APPLE_CLIENT_ID}" \
                --apple-client-secret="${APPLE_CLIENT_SECRET}" \
                --apple-scopes="${APPLE_SCOPES}" \
                --discord-client-id="${DISCORD_CLIENT_ID}" \
                --discord-client-secret="${DISCORD_CLIENT_SECRET}" \
                --discord-scopes="${DISCORD_SCOPES}" \
                --linkedin-client-id="${LINKEDIN_CLIENT_ID}" \
                --linkedin-client-secret="${LINKEDIN_CLIENT_SECRET}" \
                --linkedin-scopes="${LINKEDIN_SCOPES}" \
                --twitch-client-id="${TWITCH_CLIENT_ID}" \
                --twitch-client-secret="${TWITCH_CLIENT_SECRET}" \
                --twitch-scopes="${TWITCH_SCOPES}" \
                --twitter-client-id="${TWITTER_CLIENT_ID}" \
                --twitter-client-secret="${TWITTER_CLIENT_SECRET}" \
                --twitter-scopes="${TWITTER_SCOPES}" \
                --roblox-client-id="${ROBLOX_CLIENT_ID}" \
                --roblox-client-secret="${ROBLOX_CLIENT_SECRET}" \
                --roblox-scopes="${ROBLOX_SCOPES}"
          env:
          - name: "DATABASE_TYPE"
            value: "{{ .Values.authorizer.database_type }}"
          {{- if .Values.authorizer.database_url }}
          - name: "DATABASE_URL"
            valueFrom:
              secretKeyRef:
                name: database-url
                key: database_url
          {{- end }}
          {{- if .Values.authorizer.database_name }}
          - name: "DATABASE_NAME"
            value: "{{ .Values.authorizer.database_name }}"
          {{- end }}
          {{- if .Values.authorizer.database_host }}
          - name: "DATABASE_HOST"
            valueFrom:
              secretKeyRef:
                name: database-host
                key: database_host
          {{- end }}
          {{- if .Values.authorizer.database_port }}
          - name: "DATABASE_PORT"
            value: "{{ .Values.authorizer.database_port }}"
          {{- end }}
          {{- if .Values.authorizer.database_username }}
          - name: "DATABASE_USERNAME"
            valueFrom:
              secretKeyRef:
                name: database-username
                key: database_username
          {{- end }}
          {{- if .Values.authorizer.database_password }}
          - name: "DATABASE_PASSWORD"
            valueFrom:
              secretKeyRef:
                name: database-password
                key: database_password
          {{- end }}
          {{- if .Values.authorizer.database_cert }}
          - name: "DATABASE_CERT"
            valueFrom:
              secretKeyRef:
                name: database-cert
                key: database_cert
          {{- end }}
          {{- if .Values.authorizer.database_cert_key }}
          - name: "DATABASE_CERT_KEY"
            valueFrom:
              secretKeyRef:
                name: database-cert-key
                key: database_cert_key
          {{- end }}
          {{- if .Values.authorizer.database_ca_cert }}
          - name: "DATABASE_CA_CERT"
            valueFrom:
              secretKeyRef:
                name: database-ca-cert
                key: database_ca_cert
          {{- end }}
          {{- if .Values.authorizer.client_id }}
          - name: "CLIENT_ID"
            valueFrom:
              secretKeyRef:
                name: client-id
                key: client_id
          {{- end }}
          {{- if .Values.authorizer.client_secret }}
          - name: "CLIENT_SECRET"
            valueFrom:
              secretKeyRef:
                name: client-secret
                key: client_secret
          {{- end }}
          {{- if .Values.authorizer.admin_secret }}
          - name: "ADMIN_SECRET"
            valueFrom:
              secretKeyRef:
                name: admin-secret
                key: admin_secret
          {{- end }}
          {{- if .Values.authorizer.jwt_type }}
          - name: "JWT_TYPE"
            value: "{{ .Values.authorizer.jwt_type }}"
          {{- end }}
          {{- if .Values.authorizer.jwt_secret }}
          - name: "JWT_SECRET"
            valueFrom:
              secretKeyRef:
                name: jwt-secret
                key: jwt_secret
          {{- end }}
          {{- if .Values.authorizer.encryption_key }}
          - name: "ENCRYPTION_KEY"
            valueFrom:
              secretKeyRef:
                name: encryption-key
                key: encryption_key
          {{- end }}
          {{- if .Values.authorizer.jwt_private_key }}
          - name: "JWT_PRIVATE_KEY"
            valueFrom:
              secretKeyRef:
                name: jwt-private-key
                key: jwt_private_key
          {{- end }}
          {{- if .Values.authorizer.jwt_public_key }}
          - name: "JWT_PUBLIC_KEY"
            valueFrom:
              secretKeyRef:
                name: jwt-public-key
                key: jwt_public_key
          {{- end }}
          {{- if .Values.authorizer.redis_url }}
          - name: "REDIS_URL"
            valueFrom:
              secretKeyRef:
                name: redis-url
                key: redis_url
          {{- else if not .Values.authorizer.redis_url }}
          {{- if .Values.redis.install }}
          - name: "REDIS_URL"
            value: "{{- printf "redis://redis.%s.svc.cluster.local" .Release.Namespace }}"
          {{- end }}
          {{- end }}
          {{- if .Values.authorizer.aws_access_key_id }}
          - name: "AWS_ACCESS_KEY_ID"
            valueFrom:
              secretKeyRef:
                name: aws-access-key-id
                key: aws_access_key_id
          {{- end }}
          {{- if .Values.authorizer.aws_secret_access_key }}
          - name: "AWS_SECRET_ACCESS_KEY"
            valueFrom:
              secretKeyRef:
                name: aws-secret-access-key
                key: aws_secret_access_key
          {{- end }}
          {{- if .Values.authorizer.aws_region }}
          - name: "AWS_REGION"
            value: "{{ .Values.authorizer.aws_region }}"
          {{- end }}
          {{- if .Values.authorizer.couchbase_bucket }}
          - name: "COUCHBASE_BUCKET"
            value: "{{ .Values.authorizer.couchbase_bucket }}"
          {{- end }}
          {{- if .Values.authorizer.couchbase_bucket_ram_quota }}
          - name: "COUCHBASE_RAM_QUOTA"
            value: "{{ .Values.authorizer.couchbase_bucket_ram_quota }}"
          {{- end }}
          {{- if .Values.authorizer.couchbase_scope }}
          - name: "COUCHBASE_SCOPE"
            value: "{{ .Values.authorizer.couchbase_scope }}"
          {{- end }}
          {{- if .Values.authorizer.authorizer_url }}
          - name: "AUTHORIZER_URL"
            value: "{{ .Values.authorizer.authorizer_url }}"
          {{- end }}
          - name: "HOST"
            value: {{ .Values.authorizer.host | default "0.0.0.0" | quote }}
          - name: "PORT"
            value: "{{ .Values.authorizer.http_port | default 8080 }}"
          - name: "METRICS_PORT"
            value: "{{ .Values.authorizer.metrics_port | default 8081 }}"
          - name: "METRICS_HOST"
            value: {{ .Values.authorizer.metrics_host | default "0.0.0.0" | quote }}
          - name: "LOG_LEVEL"
            value: {{ .Values.authorizer.log_level | default "info" | quote }}
          {{- if .Values.authorizer.env }}
          - name: "ENV"
            value: {{ .Values.authorizer.env | quote }}
          {{- end }}
          - name: "RATE_LIMIT_RPS"
            value: {{ .Values.authorizer.rate_limit_rps | default 30 | toString | quote }}
          - name: "RATE_LIMIT_BURST"
            value: {{ .Values.authorizer.rate_limit_burst | default 20 | toString | quote }}
          - name: "RATE_LIMIT_FAIL_CLOSED"
            value: {{ .Values.authorizer.rate_limit_fail_closed | default false | toString | quote }}
          # gRPC listener (--grpc-port). Exposed on its own Service port (see service.yaml).
          - name: "GRPC_PORT"
            value: {{ .Values.authorizer.grpc_port | default 9091 | toString | quote }}
          - name: "ENABLE_GRPC_REFLECTION"
            value: {{ include "authorizer.bool" (list .Values.authorizer.enable_grpc_reflection true) | quote }}
          # MCP tool surface, served at POST <url>/mcp on the main HTTP listener
          # (not its own port — it must be publicly reachable on the same origin
          # as the OAuth metadata clients discover it through). Requires
          # authorizer_url; guarded at render time above.
          {{- if .Values.authorizer.mcp_enabled }}
          # Set ONLY when enabled. An empty value would still expand to the flag
          # on image tags that predate it, which is a boot failure rather than a
          # no-op — see the entrypoint's ${MCP_ENABLED:+...} guard.
          - name: "MCP_ENABLED"
            value: "true"
          {{- end }}
          # OAuth client self-registration for MCP clients. Both are off by
          # default: CIMD changes the authorization endpoint's trust model for
          # every client, and DCR is an unauthenticated write endpoint.
          - name: "ENABLE_CLIENT_ID_METADATA_DOCUMENT"
            value: {{ include "authorizer.bool" (list .Values.authorizer.enable_client_id_metadata_document false) | quote }}
          - name: "CLIENT_ID_METADATA_ALLOWED_DOMAINS"
            value: {{ .Values.authorizer.client_id_metadata_allowed_domains | default "" | quote }}
          - name: "ENABLE_DYNAMIC_CLIENT_REGISTRATION"
            value: {{ include "authorizer.bool" (list .Values.authorizer.enable_dynamic_client_registration false) | quote }}
          - name: "GRPC_INSECURE"
            value: {{ .Values.authorizer.grpc_insecure | default false | toString | quote }}
          {{- if .Values.authorizer.grpc_tls_cert }}
          - name: "GRPC_TLS_CERT"
            value: "{{ .Values.authorizer.grpc_tls_cert }}"
          {{- end }}
          {{- if .Values.authorizer.grpc_tls_key }}
          - name: "GRPC_TLS_KEY"
            value: "{{ .Values.authorizer.grpc_tls_key }}"
          {{- end }}
          {{- if .Values.authorizer.twilio_account_sid }}
          - name: "TWILIO_ACCOUNT_SID"
            valueFrom:
              secretKeyRef:
                name: twilio-account-sid
                key: twilio_account_sid
          {{- end }}
          {{- if .Values.authorizer.twilio_api_key }}
          - name: "TWILIO_API_KEY"
            valueFrom:
              secretKeyRef:
                name: twilio-api-key
                key: twilio_api_key
          {{- end }}
          {{- if .Values.authorizer.twilio_api_secret }}
          - name: "TWILIO_API_SECRET"
            valueFrom:
              secretKeyRef:
                name: twilio-api-secret
                key: twilio_api_secret
          {{- end }}
          {{- if .Values.authorizer.twilio_sender }}
          - name: "TWILIO_SENDER"
            value: "{{ .Values.authorizer.twilio_sender }}"
          {{- end }}
          {{- if .Values.authorizer.smtp_host }}
          - name: "SMTP_HOST"
            value: "{{ .Values.authorizer.smtp_host }}"
          {{- end }}
          {{- if .Values.authorizer.smtp_port }}
          - name: "SMTP_PORT"
            value: "{{ .Values.authorizer.smtp_port }}"
          {{- end }}
          {{- if .Values.authorizer.smtp_username }}
          - name: "SMTP_USERNAME"
            valueFrom:
              secretKeyRef:
                name: smtp-username
                key: smtp_username
          {{- end }}
          {{- if .Values.authorizer.smtp_password }}
          - name: "SMTP_PASSWORD"
            valueFrom:
              secretKeyRef:
                name: smtp-password
                key: smtp_password
          {{- end }}
          {{- if .Values.authorizer.smtp_sender_email }}
          - name: "SENDER_EMAIL"
            value: "{{ .Values.authorizer.smtp_sender_email }}"
          {{- end }}
          {{- if .Values.authorizer.smtp_sender_name }}
          - name: "SENDER_NAME"
            value: "{{ .Values.authorizer.smtp_sender_name }}"
          {{- end }}

          # April 2026 security hardening flags. See values.yaml for the
          # operational notes attached to each one.
          {{- if .Values.authorizer.trusted_proxies }}
          - name: "TRUSTED_PROXIES"
            value: {{ .Values.authorizer.trusted_proxies | quote }}
          {{- end }}
          {{- if .Values.authorizer.refresh_token_expires_in }}
          - name: "REFRESH_TOKEN_EXPIRES_IN"
            value: {{ .Values.authorizer.refresh_token_expires_in | toString | quote }}
          {{- end }}
          - name: "ENABLE_HSTS"
            value: {{ .Values.authorizer.enable_hsts | default false | toString | quote }}
          - name: "DISABLE_CSP"
            value: {{ .Values.authorizer.disable_csp | default false | toString | quote }}
          - name: "GRAPHQL_MAX_COMPLEXITY"
            value: {{ .Values.authorizer.graphql_max_complexity | default 300 | toString | quote }}
          - name: "GRAPHQL_MAX_DEPTH"
            value: {{ .Values.authorizer.graphql_max_depth | default 15 | toString | quote }}
          - name: "GRAPHQL_MAX_ALIASES"
            value: {{ .Values.authorizer.graphql_max_aliases | default 30 | toString | quote }}
          - name: "GRAPHQL_MAX_BODY_BYTES"
            value: {{ int64 (default 1048576 .Values.authorizer.graphql_max_body_bytes) | toString | quote }}
          - name: "OAUTH2_1_STRICT"
            value: {{ .Values.authorizer.oauth2_1_strict | default false | toString | quote }}

          # HTTP routes / cookies / auth feature toggles. See values.yaml
          # for the operational notes attached to each one.
          - name: "ENABLE_LOGIN_PAGE"
            value: {{ include "authorizer.bool" (list .Values.authorizer.enable_login_page true) | quote }}
          - name: "ENABLE_ORG_DISCOVERY"
            value: {{ .Values.authorizer.enable_org_discovery | default false | toString | quote }}
          - name: "ENABLE_PLAYGROUND"
            value: {{ include "authorizer.bool" (list .Values.authorizer.enable_playground true) | quote }}
          - name: "ENABLE_GRAPHQL_INTROSPECTION"
            value: {{ include "authorizer.bool" (list .Values.authorizer.enable_graphql_introspection true) | quote }}
          - name: "DISABLE_ADMIN_HEADER_AUTH"
            value: {{ include "authorizer.bool" (list .Values.authorizer.disable_admin_header_auth true) | quote }}
          - name: "APP_COOKIE_SECURE"
            value: {{ include "authorizer.bool" (list .Values.authorizer.app_cookie_secure true) | quote }}
          - name: "APP_COOKIE_SAME_SITE"
            value: {{ .Values.authorizer.app_cookie_same_site | default "none" | quote }}
          - name: "ADMIN_COOKIE_SECURE"
            value: {{ include "authorizer.bool" (list .Values.authorizer.admin_cookie_secure true) | quote }}
          - name: "ENABLE_STRONG_PASSWORD"
            value: {{ include "authorizer.bool" (list .Values.authorizer.enable_strong_password true) | quote }}
          - name: "ENABLE_BASIC_AUTHENTICATION"
            value: {{ include "authorizer.bool" (list .Values.authorizer.enable_basic_authentication true) | quote }}
          - name: "ENABLE_EMAIL_VERIFICATION"
            value: {{ .Values.authorizer.enable_email_verification | default false | toString | quote }}
          - name: "ENABLE_MOBILE_BASIC_AUTHENTICATION"
            value: {{ include "authorizer.bool" (list .Values.authorizer.enable_mobile_basic_authentication true) | quote }}
          - name: "ENABLE_PHONE_VERIFICATION"
            value: {{ .Values.authorizer.enable_phone_verification | default false | toString | quote }}
          - name: "ENABLE_MAGIC_LINK_LOGIN"
            value: {{ .Values.authorizer.enable_magic_link_login | default false | toString | quote }}
          - name: "ENABLE_SIGNUP"
            value: {{ include "authorizer.bool" (list .Values.authorizer.enable_signup true) | quote }}
          - name: "ENFORCE_MFA"
            value: {{ include "authorizer.bool" (list .Values.authorizer.enforce_mfa false) | quote }}
          - name: "DISABLE_TOTP_LOGIN"
            value: {{ .Values.authorizer.disable_totp_login | default false | toString | quote }}
          - name: "DISABLE_WEBAUTHN_MFA"
            value: {{ .Values.authorizer.disable_webauthn_mfa | default false | toString | quote }}
          - name: "DISABLE_EMAIL_OTP"
            value: {{ .Values.authorizer.disable_email_otp | default false | toString | quote }}
          - name: "DISABLE_SMS_OTP"
            value: {{ .Values.authorizer.disable_sms_otp | default false | toString | quote }}
          - name: "DISABLE_MFA"
            value: {{ .Values.authorizer.disable_mfa | default false | toString | quote }}

          # FGA (OpenFGA) integration
          {{- if .Values.authorizer.fga_store }}
          - name: "FGA_STORE"
            valueFrom:
              secretKeyRef:
                name: fga-store
                key: fga_store
          {{- end }}
          {{- if .Values.authorizer.fga_store_url }}
          - name: "FGA_STORE_URL"
            valueFrom:
              secretKeyRef:
                name: fga-store-url
                key: fga_store_url
          {{- end }}
          # 2.4.0: a delegated (agent-acting-for-user) FGA check against a model
          # with no `type agent` now DENIES rather than silently authorizing as
          # the user alone. Set true only while migrating a model.
          - name: "FGA_ALLOW_UNCONSTRAINED_AGENTS"
            value: {{ include "authorizer.bool" (list .Values.authorizer.fga_allow_unconstrained_agents false) | quote }}

          # JWT additional config
          {{- if .Values.authorizer.jwt_role_claim }}
          - name: "JWT_ROLE_CLAIM"
            value: "{{ .Values.authorizer.jwt_role_claim }}"
          {{- end }}
          {{- if .Values.authorizer.jwt_secondary_type }}
          - name: "JWT_SECONDARY_TYPE"
            value: "{{ .Values.authorizer.jwt_secondary_type }}"
          {{- end }}
          {{- if .Values.authorizer.jwt_secondary_secret }}
          - name: "JWT_SECONDARY_SECRET"
            valueFrom:
              secretKeyRef:
                name: jwt-secondary-secret
                key: jwt_secondary_secret
          {{- end }}
          {{- if .Values.authorizer.jwt_secondary_private_key }}
          - name: "JWT_SECONDARY_PRIVATE_KEY"
            valueFrom:
              secretKeyRef:
                name: jwt-secondary-private-key
                key: jwt_secondary_private_key
          {{- end }}
          {{- if .Values.authorizer.jwt_secondary_public_key }}
          - name: "JWT_SECONDARY_PUBLIC_KEY"
            valueFrom:
              secretKeyRef:
                name: jwt-secondary-public-key
                key: jwt_secondary_public_key
          {{- end }}

          # Custom access token script
          {{- if .Values.authorizer.custom_access_token_script }}
          - name: "CUSTOM_ACCESS_TOKEN_SCRIPT"
            value: {{ .Values.authorizer.custom_access_token_script | quote }}
          {{- end }}

          # Access control
          {{- if .Values.authorizer.roles }}
          - name: "ROLES"
            value: "{{ .Values.authorizer.roles }}"
          {{- end }}
          {{- if .Values.authorizer.default_roles }}
          - name: "DEFAULT_ROLES"
            value: "{{ .Values.authorizer.default_roles }}"
          {{- end }}
          {{- if .Values.authorizer.protected_roles }}
          - name: "PROTECTED_ROLES"
            value: "{{ .Values.authorizer.protected_roles }}"
          {{- end }}
          {{- if .Values.authorizer.allowed_origins }}
          - name: "ALLOWED_ORIGINS"
            value: "{{ .Values.authorizer.allowed_origins }}"
          {{- end }}

          # OAuth response config
          {{- if .Values.authorizer.default_authorize_response_type }}
          - name: "DEFAULT_AUTHORIZE_RESPONSE_TYPE"
            value: "{{ .Values.authorizer.default_authorize_response_type }}"
          {{- end }}
          {{- if .Values.authorizer.default_authorize_response_mode }}
          - name: "DEFAULT_AUTHORIZE_RESPONSE_MODE"
            value: "{{ .Values.authorizer.default_authorize_response_mode }}"
          {{- end }}

          # Branding
          {{- if .Values.authorizer.organization_name }}
          - name: "ORGANIZATION_NAME"
            value: "{{ .Values.authorizer.organization_name }}"
          {{- end }}
          {{- if .Values.authorizer.organization_logo }}
          - name: "ORGANIZATION_LOGO"
            value: "{{ .Values.authorizer.organization_logo }}"
          {{- end }}

          # SMTP additional options
          {{- if .Values.authorizer.smtp_local_name }}
          - name: "SMTP_LOCAL_NAME"
            value: "{{ .Values.authorizer.smtp_local_name }}"
          {{- end }}
          {{- if .Values.authorizer.smtp_skip_tls_verification }}
          - name: "SMTP_SKIP_TLS_VERIFICATION"
            value: {{ .Values.authorizer.smtp_skip_tls_verification | toString | quote }}
          {{- end }}

          # URL configuration
          {{- if .Values.authorizer.reset_password_url }}
          - name: "RESET_PASSWORD_URL"
            value: "{{ .Values.authorizer.reset_password_url }}"
          {{- end }}
          {{- if .Values.authorizer.backchannel_logout_uri }}
          - name: "BACKCHANNEL_LOGOUT_URI"
            value: "{{ .Values.authorizer.backchannel_logout_uri }}"
          {{- end }}

          # OAuth providers
          {{- if .Values.authorizer.google_client_id }}
          - name: "GOOGLE_CLIENT_ID"
            valueFrom:
              secretKeyRef:
                name: google-client-id
                key: google_client_id
          {{- end }}
          {{- if .Values.authorizer.google_client_secret }}
          - name: "GOOGLE_CLIENT_SECRET"
            valueFrom:
              secretKeyRef:
                name: google-client-secret
                key: google_client_secret
          {{- end }}
          {{- if .Values.authorizer.google_scopes }}
          - name: "GOOGLE_SCOPES"
            value: "{{ .Values.authorizer.google_scopes }}"
          {{- end }}
          {{- if .Values.authorizer.github_client_id }}
          - name: "GITHUB_CLIENT_ID"
            valueFrom:
              secretKeyRef:
                name: github-client-id
                key: github_client_id
          {{- end }}
          {{- if .Values.authorizer.github_client_secret }}
          - name: "GITHUB_CLIENT_SECRET"
            valueFrom:
              secretKeyRef:
                name: github-client-secret
                key: github_client_secret
          {{- end }}
          {{- if .Values.authorizer.github_scopes }}
          - name: "GITHUB_SCOPES"
            value: "{{ .Values.authorizer.github_scopes }}"
          {{- end }}
          {{- if .Values.authorizer.facebook_client_id }}
          - name: "FACEBOOK_CLIENT_ID"
            valueFrom:
              secretKeyRef:
                name: facebook-client-id
                key: facebook_client_id
          {{- end }}
          {{- if .Values.authorizer.facebook_client_secret }}
          - name: "FACEBOOK_CLIENT_SECRET"
            valueFrom:
              secretKeyRef:
                name: facebook-client-secret
                key: facebook_client_secret
          {{- end }}
          {{- if .Values.authorizer.facebook_scopes }}
          - name: "FACEBOOK_SCOPES"
            value: "{{ .Values.authorizer.facebook_scopes }}"
          {{- end }}
          {{- if .Values.authorizer.microsoft_client_id }}
          - name: "MICROSOFT_CLIENT_ID"
            valueFrom:
              secretKeyRef:
                name: microsoft-client-id
                key: microsoft_client_id
          {{- end }}
          {{- if .Values.authorizer.microsoft_client_secret }}
          - name: "MICROSOFT_CLIENT_SECRET"
            valueFrom:
              secretKeyRef:
                name: microsoft-client-secret
                key: microsoft_client_secret
          {{- end }}
          {{- if .Values.authorizer.microsoft_tenant_id }}
          - name: "MICROSOFT_TENANT_ID"
            value: "{{ .Values.authorizer.microsoft_tenant_id }}"
          {{- end }}
          {{- if .Values.authorizer.microsoft_allowed_tenants }}
          - name: "MICROSOFT_ALLOWED_TENANTS"
            value: "{{ .Values.authorizer.microsoft_allowed_tenants }}"
          {{- end }}
          {{- if .Values.authorizer.microsoft_scopes }}
          - name: "MICROSOFT_SCOPES"
            value: "{{ .Values.authorizer.microsoft_scopes }}"
          {{- end }}
          # 2.4.0 nOAuth defense: a social login whose provider did not attest
          # the email no longer links to an existing account. This is the
          # compatibility escape hatch; the server warns on every boot when set.
          - name: "OAUTH_ALLOW_UNVERIFIED_PROVIDER_EMAIL"
            value: {{ include "authorizer.bool" (list .Values.authorizer.oauth_allow_unverified_provider_email false) | quote }}
          {{- if .Values.authorizer.apple_client_id }}
          - name: "APPLE_CLIENT_ID"
            valueFrom:
              secretKeyRef:
                name: apple-client-id
                key: apple_client_id
          {{- end }}
          {{- if .Values.authorizer.apple_client_secret }}
          - name: "APPLE_CLIENT_SECRET"
            valueFrom:
              secretKeyRef:
                name: apple-client-secret
                key: apple_client_secret
          {{- end }}
          {{- if .Values.authorizer.apple_scopes }}
          - name: "APPLE_SCOPES"
            value: "{{ .Values.authorizer.apple_scopes }}"
          {{- end }}
          {{- if .Values.authorizer.discord_client_id }}
          - name: "DISCORD_CLIENT_ID"
            valueFrom:
              secretKeyRef:
                name: discord-client-id
                key: discord_client_id
          {{- end }}
          {{- if .Values.authorizer.discord_client_secret }}
          - name: "DISCORD_CLIENT_SECRET"
            valueFrom:
              secretKeyRef:
                name: discord-client-secret
                key: discord_client_secret
          {{- end }}
          {{- if .Values.authorizer.discord_scopes }}
          - name: "DISCORD_SCOPES"
            value: "{{ .Values.authorizer.discord_scopes }}"
          {{- end }}
          {{- if .Values.authorizer.linkedin_client_id }}
          - name: "LINKEDIN_CLIENT_ID"
            valueFrom:
              secretKeyRef:
                name: linkedin-client-id
                key: linkedin_client_id
          {{- end }}
          {{- if .Values.authorizer.linkedin_client_secret }}
          - name: "LINKEDIN_CLIENT_SECRET"
            valueFrom:
              secretKeyRef:
                name: linkedin-client-secret
                key: linkedin_client_secret
          {{- end }}
          {{- if .Values.authorizer.linkedin_scopes }}
          - name: "LINKEDIN_SCOPES"
            value: "{{ .Values.authorizer.linkedin_scopes }}"
          {{- end }}
          {{- if .Values.authorizer.twitch_client_id }}
          - name: "TWITCH_CLIENT_ID"
            valueFrom:
              secretKeyRef:
                name: twitch-client-id
                key: twitch_client_id
          {{- end }}
          {{- if .Values.authorizer.twitch_client_secret }}
          - name: "TWITCH_CLIENT_SECRET"
            valueFrom:
              secretKeyRef:
                name: twitch-client-secret
                key: twitch_client_secret
          {{- end }}
          {{- if .Values.authorizer.twitch_scopes }}
          - name: "TWITCH_SCOPES"
            value: "{{ .Values.authorizer.twitch_scopes }}"
          {{- end }}
          {{- if .Values.authorizer.twitter_client_id }}
          - name: "TWITTER_CLIENT_ID"
            valueFrom:
              secretKeyRef:
                name: twitter-client-id
                key: twitter_client_id
          {{- end }}
          {{- if .Values.authorizer.twitter_client_secret }}
          - name: "TWITTER_CLIENT_SECRET"
            valueFrom:
              secretKeyRef:
                name: twitter-client-secret
                key: twitter_client_secret
          {{- end }}
          {{- if .Values.authorizer.twitter_scopes }}
          - name: "TWITTER_SCOPES"
            value: "{{ .Values.authorizer.twitter_scopes }}"
          {{- end }}
          {{- if .Values.authorizer.roblox_client_id }}
          - name: "ROBLOX_CLIENT_ID"
            valueFrom:
              secretKeyRef:
                name: roblox-client-id
                key: roblox_client_id
          {{- end }}
          {{- if .Values.authorizer.roblox_client_secret }}
          - name: "ROBLOX_CLIENT_SECRET"
            valueFrom:
              secretKeyRef:
                name: roblox-client-secret
                key: roblox_client_secret
          {{- end }}
          {{- if .Values.authorizer.roblox_scopes }}
          - name: "ROBLOX_SCOPES"
            value: "{{ .Values.authorizer.roblox_scopes }}"
          {{- end }}

          {{- if .Values.extraEnv }}
          {{- toYaml .Values.extraEnv | nindent 10 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ int (.Values.authorizer.http_port | default 8080) }}
              protocol: TCP
            - name: metrics
              containerPort: {{ int (.Values.authorizer.metrics_port | default 8081) }}
              protocol: TCP
            - name: grpc
              containerPort: {{ int (.Values.authorizer.grpc_port | default 9091) }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
