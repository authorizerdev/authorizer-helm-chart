apiVersion: v2
name: authorizer
description: A Helm chart for Authorizer. Authorizer is an open-source authentication and authorization solution for your applications. Bring your database and have complete control over the user information. You can self-host authorizer instances and connect to any database (Currently supports 11+ databases including Postgres, MySQL, SQLite, SQLServer, YugaByte, MariaDB, PlanetScale, CassandraDB, ScyllaDB, MongoDB, ArangoDB, DynamoDB).

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# Chart version. Kept EQUAL to appVersion: `helm install --version X.Y.Z` gets
# Authorizer X.Y.Z, with no mapping table to consult.
#
# They drifted through the 2.4.x line because chart-only fixes patch-bumped this
# independently (chart 2.4.5 while the app was still 2.4.0), which then collided:
# by the time Authorizer 2.4.1 shipped, chart 2.4.1 had already been consumed.
# Re-synced at 2.4.1.
#
# So a chart-only fix does NOT bump this on its own — it rides the next
# Authorizer release, or you cut an Authorizer patch release to carry it.
# Versions follow Semantic Versioning (https://semver.org/).
version: 2.4.1

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
appVersion: "2.4.1"

icon: "https://authorizer.dev/images/logo.png"
