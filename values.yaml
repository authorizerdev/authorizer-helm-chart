# Default values for ..
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: quay.io/authorizer/authorizer
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534 # nobody user

service:
  type: ClusterIP
  port: 80
  # Fallback if authorizer.http_port is unset (keep in sync with app listen port).
  targetPort: 8080
  # gRPC listener exposure (--grpc-port). The app serves the same public API
  # over gRPC; enable to add a `grpc` port to the Service. Disable if you only
  # consume the HTTP/GraphQL/REST surface.
  grpc:
    enabled: true
    # Service port for gRPC. Defaults to authorizer.grpc_port (9091).
    port: 9091

# Optional Prometheus Operator integration and internal metrics Service.
# The app always exposes a dedicated /metrics listener on metrics_port (default 8081).
metrics:
  service:
    # ClusterIP Service for scraping (not exposed on Ingress by default).
    enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

resources:
  {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Add any extra environment variables here.
# These are set on the pod and expanded in the CLI args via shell.
# https://docs.authorizer.dev/core/env
extraEnv:
  []
  # - name: "CUSTOM_ACCESS_TOKEN_SCRIPT"
  #   value: "my-script"

# Redis server configuration
# If not specified standard storage class will be used with 5gi size
redis:
  # Install redis
  # (if set to true will install redis)
  install: null
  storageClassName: null
  storage: null

authorizer:
  # Host address to listen on (--host).
  host: "0.0.0.0"

  # Main HTTP listen port (--http-port). Must differ from metrics_port.
  http_port: 8080

  # Dedicated Prometheus /metrics listener (--metrics-port).
  metrics_port: 8081

  # Bind address for /metrics (--metrics-host). Use 0.0.0.0 for in-cluster scraping.
  metrics_host: "0.0.0.0"

  # Log level (--log-level): debug, info, warn, error.
  log_level: "info"

  # Environment label for this instance (--env), e.g. "production", "staging".
  env: null

  # gRPC server (--grpc-port, --enable-grpc-reflection, --grpc-insecure,
  # --grpc-tls-cert, --grpc-tls-key). The same public API is served over gRPC;
  # the REST gateway (/v1/*) wraps it in-process. Must differ from http_port
  # and metrics_port. Set service.grpc.enabled to expose it on the Service.
  grpc_port: 9091
  enable_grpc_reflection: true
  # Run gRPC without TLS. Leave true for in-cluster plaintext (mTLS handled by
  # a mesh, or terminated at an ingress). Set false and provide certs for
  # native TLS.
  grpc_insecure: true
  # Paths (inside the container) to the gRPC TLS cert/key. Mount via extraEnv +
  # volumes if using native TLS.
  grpc_tls_cert: null
  grpc_tls_key: null

  # Per-IP rate limiting (--rate-limit-rps, --rate-limit-burst, --rate-limit-fail-closed).
  # With redis_url (or chart-bundled Redis), limits are shared across replicas.
  rate_limit_rps: 30
  rate_limit_burst: 20
  rate_limit_fail_closed: false

  # Redis URL where sessions can be persisted
  # If not set and if install is not set to true
  # it will persist session in-memory
  redis_url: null

  # Which database you are using. Supported database
  # types are postgres, mysql, planetscale, sqlite, sqlserver,
  # mongodb, arangodb, yugabyte, mariadb, cassandradb, scylladb, dynamodb, couchbase
  database_type: null

  # Database connection string. In case of cluster url eg. for
  # cassandra db, you can use comma separated IPs.
  database_url: null

  # Database name
  database_name: null

  # Database host name
  database_host: null

  # Database port
  database_port: null

  # Database username
  database_username: null

  # Database password
  database_password: null

  # Database certificate in base 64 encoded form
  database_cert: null

  # Database certificate key in base 64 encoded form
  database_cert_key: null

  # Database CA certificate in base 64 encoded form
  database_ca_cert: null

  # AWS region. In case of dynamodb database_type
  aws_region: null

  # AWS access key identifier. In case of dynamodb database_type
  aws_access_key_id: null

  # AWS secret access key. In case of dynamodb database_type
  aws_secret_access_key: null

  # URL for authorizer deployment
  authorizer_url: null

  # Couchbase bucket. In case of couchbase database_type
  couchbase_bucket: null

  # Couchbase bucket ram quota. In case of couchbase database_type
  couchbase_bucket_ram_quota: null

  # Couchbase scope. In case of couchbase database_type
  couchbase_scope: null

  # OAuth client ID (required)
  client_id: null

  # OAuth client secret (required)
  client_secret: null

  # Admin secret (--admin-secret).
  # REQUIRED, non-empty. As of the April 2026 security release the
  # authorizer binary refuses to start when --admin-secret is empty —
  # the previous insecure "password" default has been removed. Pick any
  # non-empty value; the strength of the secret is your responsibility.
  admin_secret: null

  # JWT type (e.g. HS256, RS256)
  jwt_type: null

  # JWT secret (for HMAC-based JWT)
  jwt_secret: null

  # JWT private key (for RSA/EC-based JWT)
  jwt_private_key: null

  # JWT public key (for RSA/EC-based JWT)
  jwt_public_key: null

  # Twilio Account SID for SMS support
  twilio_account_sid: null

  # Twilio API Key for SMS support
  twilio_api_key: null

  # Twilio API Secret for SMS support
  twilio_api_secret: null

  # Twilio Sender phone number for SMS support
  twilio_sender: null

  # SMTP host for email
  smtp_host: null

  # SMTP port for email
  smtp_port: null

  # SMTP username for email
  smtp_username: null

  # SMTP password for email
  smtp_password: null

  # SMTP sender email
  smtp_sender_email: null

  # SMTP sender name
  smtp_sender_name: null

  # ----------------------------------------------------------------------
  # April 2026 security hardening flags
  # ----------------------------------------------------------------------

  # Trusted reverse-proxy networks (--trusted-proxies). Comma-separated CIDRs.
  # Empty (the default) means gin uses RemoteAddr and ignores X-Forwarded-For
  # — safe out of the box. If Authorizer is behind an ingress controller,
  # nginx, Cloudflare, etc., set this to the proxy network or per-IP rate
  # limiting and audit logs will key on the proxy IP. See
  # https://docs.authorizer.dev/core/security#trusted-proxies
  trusted_proxies: null

  # Refresh-token lifetime in seconds (--refresh-token-expires-in).
  # Default 30 days (2592000). Shorten for higher-security deployments;
  # lengthen for long-lived sessions.
  refresh_token_expires_in: null

  # Strict-Transport-Security response header (--enable-hsts).
  # Off by default — only enable behind TLS, otherwise browsers will be
  # locked out for a year (max-age=31536000).
  enable_hsts: false

  # Disable the default Content-Security-Policy header (--disable-csp).
  # CSP is on by default with a conservative policy. Set true ONLY as an
  # escape hatch if the default policy breaks a customised dashboard.
  disable_csp: false

  # GraphQL query limits (--graphql-max-*). Defaults are conservative;
  # raise individually if your legitimate operation surface needs them.
  # Rejections are emitted as the authorizer_graphql_limit_rejections_total
  # Prometheus counter, labelled by the limit kind that tripped.
  graphql_max_complexity: 300
  graphql_max_depth: 15
  graphql_max_aliases: 30
  graphql_max_body_bytes: 1048576

  # ----------------------------------------------------------------------
  # HTTP routes / cookies / auth feature toggles
  # ----------------------------------------------------------------------

  enable_login_page: true
  # Public organization (home-realm) discovery endpoint + /app email-first
  # SSO routing step (--enable-org-discovery). Opt-in; off keeps the login
  # page unchanged.
  enable_org_discovery: false
  enable_playground: true
  enable_graphql_introspection: true

  # Disable admin authentication via the X-Authorizer-Admin-Secret header
  # (--disable-admin-header-auth). true (default here) requires session/
  # cookie-based admin auth instead of the static header secret.
  disable_admin_header_auth: true

  app_cookie_secure: true
  # SameSite attribute for session cookies (lax, strict, none).
  app_cookie_same_site: "none"
  admin_cookie_secure: true

  enable_strong_password: true
  enable_basic_authentication: true
  enable_email_verification: false
  enable_mobile_basic_authentication: true
  enable_phone_verification: false
  enable_magic_link_login: false
  enable_signup: true

  # MFA (--enforce-mfa, --disable-*). MFA methods are enabled by default and
  # opted out via disable_*; enforce_mfa forces enrollment for all users.
  enforce_mfa: true
  disable_totp_login: false
  disable_webauthn_mfa: false
  disable_email_otp: false
  disable_sms_otp: false
  disable_mfa: false

  # FGA (OpenFGA) integration
  fga_store: null
  fga_store_url: null

  # JWT additional config
  jwt_role_claim: null
  jwt_secondary_type: null
  jwt_secondary_secret: null
  jwt_secondary_private_key: null
  jwt_secondary_public_key: null

  # Custom access token script (JavaScript, URL-encoded)
  custom_access_token_script: null

  # Access control (comma-separated values)
  roles: null
  default_roles: null
  protected_roles: null
  allowed_origins: null

  # OAuth response config
  default_authorize_response_type: null
  default_authorize_response_mode: null

  # Enforce OAuth 2.1 restrictions (--oauth2-1-strict): reject the
  # implicit/hybrid-with-token response types and PKCE plain (require S256).
  # Breaking; opt-in.
  oauth2_1_strict: false

  # Branding
  organization_name: null
  organization_logo: null

  # SMTP additional options
  smtp_local_name: null
  smtp_skip_tls_verification: false

  # URL configuration
  reset_password_url: null
  backchannel_logout_uri: null

  # OAuth providers
  google_client_id: null
  google_client_secret: null
  google_scopes: null

  github_client_id: null
  github_client_secret: null
  github_scopes: null

  facebook_client_id: null
  facebook_client_secret: null
  facebook_scopes: null

  microsoft_client_id: null
  microsoft_client_secret: null
  microsoft_tenant_id: null
  microsoft_scopes: null

  apple_client_id: null
  apple_client_secret: null
  apple_scopes: null

  discord_client_id: null
  discord_client_secret: null
  discord_scopes: null

  linkedin_client_id: null
  linkedin_client_secret: null
  linkedin_scopes: null

  twitch_client_id: null
  twitch_client_secret: null
  twitch_scopes: null

  twitter_client_id: null
  twitter_client_secret: null
  twitter_scopes: null

  roblox_client_id: null
  roblox_client_secret: null
  roblox_scopes: null
